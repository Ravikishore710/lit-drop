[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-document-intelligence"
version = "0.1.0"
description = "Production-grade multimodal AI system for scientific document intelligence, parsing, hybrid retrieval, and grounded reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Scientific Multimodal Document Intelligence Team" }
]
keywords = [
    "multimodal",
    "scientific-documents",
    "pdf-intelligence",
    "hybrid-retrieval",
    "qdrant",
    "neo4j",
    "reranking",
    "citation-grounding"
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pypdf>=4.2.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    "qdrant-client>=1.9.0",
    "neo4j>=5.19.0",
    "sentence-transformers>=2.7.0",
    "python-multipart>=0.0.9",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
evaluation = [
    "scikit-learn>=1.4.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1"
]

[project.scripts]
docintel-arxiv = "scripts.download_arxiv:main"
docintel-validate = "scripts.validate_sample_corpus:main"
docintel-benchmarks = "scripts.download_benchmarks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
