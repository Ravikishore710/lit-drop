version: "3.8"

services:
  # FastAPI Backend Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: scidocintel_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=scientific_docintel_secret
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - qdrant
      - neo4j
    networks:
      - docintel-net

  # Frontend Research Studio
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: scidocintel_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - docintel-net

  # Qdrant Vector Search Engine (HNSW + SQ8)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: scidocintel_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - docintel-net

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.19.0-community
    container_name: scidocintel_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/scientific_docintel_secret
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - docintel-net

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:

networks:
  docintel-net:
    driver: bridge
