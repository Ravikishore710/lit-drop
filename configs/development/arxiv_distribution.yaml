# arXiv Ingestion Category Distribution
# Target Phase A: 2,000 papers
# Target Phase B: 5,000 papers
# Stretch target: 10,000 papers

total_target_phase_a: 2000
total_target_phase_b: 5000

categories:
  computer_science:
    target_count: 800
    arxiv_codes:
      - cs.AI   # Artificial Intelligence
      - cs.LG   # Machine Learning
      - cs.CV   # Computer Vision
      - cs.CL   # Computation and Language
      - cs.RO   # Robotics
      - cs.DC   # Distributed Computing
      - cs.CR   # Cryptography and Security

  physics:
    target_count: 300
    arxiv_codes:
      - quant-ph # Quantum Physics
      - cond-mat.mes-hall # Mesoscale and Nanoscale Physics
      - physics.optics    # Optics
      - physics.app-ph    # Applied Physics
      - gr-qc             # General Relativity and Quantum Cosmology

  mathematics:
    target_count: 300
    arxiv_codes:
      - math.OC # Optimization and Control
      - math.PR # Probability
      - math.NA # Numerical Analysis
      - math.ST # Mathematical Statistics
      - math.DS # Dynamical Systems

  engineering:
    target_count: 300
    arxiv_codes:
      - eess.SP # Signal Processing
      - eess.SY # Systems and Control
      - eess.IV # Image and Video Processing
      - cs.SY   # Systems and Control (CS cross-list)

  statistics:
    target_count: 150
    arxiv_codes:
      - stat.ML # Machine Learning (Statistics)
      - stat.ME # Methodology
      - stat.AP # Applications
      - stat.TH # Theory

  other_scientific_technical:
    target_count: 150
    arxiv_codes:
      - q-bio.BM # Biomolecules
      - q-bio.QM # Quantitative Methods
      - stat.CO  # Computation
      - physics.data-an # Data Analysis, Statistics and Probability

selection_criteria:
  min_pages: 5
  max_pages: 30
  require_equations: true
  require_figures_or_tables: true
  require_references: true
  min_sections: 3
