    restrictions: "Official validation and test splits must not be leaked into prompt engineering or tuning."

  chartqapro:
    dataset_name: "ChartQAPro: Harder and More Diverse Chart Reasoning Benchmark"
    source_url: "https://github.com/vis-nlp/ChartQAPro"
