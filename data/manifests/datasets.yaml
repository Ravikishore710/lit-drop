version: "1.0.0"
updated_at: "2026-09-14"

datasets:
  arxiv_production:
    dataset_name: "arXiv Scientific Papers (Bulk Access / API Subset)"
    source_url: "https://info.arxiv.org/help/bulk_data.html"
    api_url: "https://info.arxiv.org/help/api/basics.html"
    official_repository: "https://arxiv.org"
    license: "arXiv.org perpetual non-exclusive license / CC licenses vary by article"
    download_date: "2026-09-14"
    version_or_commit: "v1-2026"
    checksum: "sha256:dynamic_per_pdf"
    intended_use: "Production corpus for multimodal extraction, indexing, and grounded QA"
    restrictions: "Non-commercial evaluation & research corpus. Abide by individual paper licenses and rate limits."

